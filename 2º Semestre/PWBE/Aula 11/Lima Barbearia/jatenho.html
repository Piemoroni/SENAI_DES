<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clube do Bigode</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
</head>
<header>
    <h1> Clube do Bigode </h1>
    <h3> Sua autoestima melhorada!</h3>
    <img src = "download.png" class="img">
</header>
<body>
    <section class="cadastro">
        <div class="novaConta">
            <h1> Entrar: </h1>
            <p>
                <label for="Nome"> Nome Completo: </label>
                <input type="text" id="nome" placeholder="Insira seu nome" required />
                <br>
            </p>
            <p>
                <label for="email"> E-mail: </label>
                <input type="text" id="email" placeholder="Insira seu Email escolar" required />
                <br>
            </p>
            <p>
                <label for="senha"> Senha: </label>
                <input type="text" id="senha" placeholder="Insira sua senha" required />
            </p>
            <p>
                <label for="unidade"> Sua data de Nascimento: </label>
                <input type="date" id="data" name="data">
            </p>
            <div class = "botaonovaConta">
            <p>
                <button onclick="Confirmar()"> <a href = "home.html">Confirmar </a></button>
                <script>
                    function Confirmar() {
                        alert("Dados Confirmados!")
                    }
                </script>

                <input type="reset" value="Limpar" class="limpar"/>
            </p>
            </div>
        </div>
    </section>
    
</body>
</html>
