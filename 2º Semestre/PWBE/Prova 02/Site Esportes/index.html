<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="style.css">

<header>

<body>
    <section class="cadastro">


        <div class="novaConta">
            <h1> Crie Sua Conta: </h1>
            <p>

                <input type="text" id="nome" placeholder="Insira seu nome" required />
                <br>
            </p>
            <p>
                <label for="email"> E-mail: </label>
                <input type="text" id="email" placeholder="Insira seu Email escolar" required />
                <br>
            </p>
            <p>
                <label for="senha"> Turma: </label>
                <input type="text" id="senha" placeholder="Insira sua senha" required />
            </p>
            <p>
                <label for="unidade"> Unidade escolar </label>
                <select id="unidade">
                    <option> SESI CE 356 - SESI Waldyr Beira </option>
                    <option> SESI CE 001 - SESI Vila Leopoldina </option>
                    <option> SESI CE 148 - SESI Santo André </option>
                    <option> SESI CE 024 - SESI Guarulhos </option>
                    <option> SESI CE 036 - SESI Itaquera </option>
                    <option> SESI CE 060 - SESI Osasco </option>
                    <option> SESI CE 083 - SESI São Bernardo do Campo </option>
                    <option> SESI CE 109 - SESI Mauá </option>
                    <option> SESI CE 128 - SESI Suzano </option>
                    <option> SESI CE 155 - SESI Carapicuíba </option>
                    <option> SESI CE 192 - SESI Barueri </option>
                </select>
            </p>
            <div class = "botaonovaConta">
                <button onclick="Confirmar()"> <a href = "home.html">Confirmar </a></button>
                <script>
                    function Confirmar() {
                        alert("Dados Confirmados!")
                    }
                </script>
                <br>
                <button onclick="ja_tenho()"> <a href="jatenho.html"> Entrar em conta já existente!!</a> </button>
            </div>
        </form>
    </section>
    <footer>
        <p> Made With <i class="fa-solid fa-heart fa-beat" style="color: #d02525;"></i> By Pietra Moroni</p>
    </footer>
</body>
